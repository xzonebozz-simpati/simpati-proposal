<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Ganti Password | PROPOSAL MANAGEMENT SIMPATI 555</title>
<style>
:root{--maroon:#5b1018;--deep:#31090e;--gold:#d8b15a;--cream:#f7f1e8;--ink:#292321;--muted:#756c68;--line:#e7ddd2}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;padding:20px;color:var(--ink);
  font:15px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
  background:radial-gradient(circle at 20% 10%,#7d1626 0,#31090e 55%,#1d0508 100%)}
.card{width:100%;max-width:420px;background:var(--cream);border:2px solid var(--gold);border-radius:16px;
  padding:28px 26px;box-shadow:0 18px 50px #0008}
.brand{font-size:12px;letter-spacing:.14em;color:var(--maroon);font-weight:800}
h1{margin:6px 0 4px;font-size:22px;color:var(--deep)}
p.sub{margin:0 0 18px;color:var(--muted);font-size:13.5px}
label{display:block;font-weight:700;font-size:13px;margin:12px 0 5px;color:var(--deep)}
input{width:100%;padding:11px 12px;border:1px solid #cdbfae;border-radius:9px;font:inherit;background:#fff}
input:focus{outline:2px solid var(--gold);border-color:var(--maroon)}
button{width:100%;margin-top:18px;padding:12px;border:1px solid var(--gold);border-radius:10px;cursor:pointer;
  color:#fff;font:inherit;font-weight:800;background:linear-gradient(110deg,#8c1c2b,var(--maroon))}
button:disabled{opacity:.6;cursor:wait}
.msg{display:none;margin-top:14px;padding:10px 12px;border-radius:9px;font-size:13.5px;border:1px solid}
.msg.err{display:block;background:#fde9ea;border-color:#e3a3a8;color:#7a1220}
.msg.info{display:block;background:#fff6dc;border-color:#e0ad35;color:#5a3d0a}
.note{margin-top:16px;font-size:12.5px;color:var(--muted)}
</style>
</head>
<body>
<main class="card">
  <div class="brand">SIMPATI 555 · MODUL PROPOSAL MANAGEMENT</div>
  <h1>Ganti Password</h1>
  <p class="sub" id="sub">Memuat akun...</p>
  <form id="f" autocomplete="off">
    <label for="o">Password saat ini</label>
    <input id="o" type="password" autocomplete="current-password" required maxlength="200" autofocus>
    <label for="n">Password baru (minimal 12 karakter)</label>
    <input id="n" type="password" autocomplete="new-password" required minlength="12" maxlength="200">
    <label for="c">Ulangi password baru</label>
    <input id="c" type="password" autocomplete="new-password" required minlength="12" maxlength="200">
    <button id="b" type="submit">SIMPAN PASSWORD BARU</button>
  </form>
  <div id="m" class="msg" role="alert"></div>
  <p class="note" id="back" style="display:none"><a href="/">&larr; Kembali ke Proposal</a> &nbsp;·&nbsp; <a href="#" id="out">Keluar</a></p>
</main>
<script>
(function(){
  var m=document.getElementById('m'),forced=false;
  function show(t,k){m.textContent=t;m.className='msg '+k}
  fetch('/api/me',{headers:{Accept:'application/json'}}).then(function(r){if(!r.ok)throw 0;return r.json()}).then(function(me){
    forced=!!me.must_change_password;
    document.getElementById('sub').textContent=forced
      ?'Akun '+me.username+' masih memakai password awal dari Superadmin. Buat password pribadi sebelum melanjutkan.'
      :'Akun '+me.username+' · '+me.territory;
    document.getElementById('back').style.display='block';
    if(forced)document.querySelector('#back a[href="/"]').style.display='none';
  }).catch(function(){location.replace('/login?expired=1')});
  document.getElementById('out').addEventListener('click',async function(e){
    e.preventDefault();
    try{await fetch('/api/auth/logout',{method:'POST',headers:{'X-Requested-With':'proposal'}})}catch(_){}
    location.replace('/login');
  });
  document.getElementById('f').addEventListener('submit',async function(e){
    e.preventDefault();
    var o=document.getElementById('o').value,n=document.getElementById('n').value,c=document.getElementById('c').value;
    if(n.length<12)return show('Password baru minimal 12 karakter.','err');
    if(n!==c)return show('Konfirmasi password baru tidak sama.','err');
    var b=document.getElementById('b');b.disabled=true;b.textContent='MENYIMPAN...';m.className='msg';
    try{
      var r=await fetch('/api/auth/change-password',{method:'POST',
        headers:{'Content-Type':'application/json','X-Requested-With':'proposal'},
        body:JSON.stringify({old_password:o,new_password:n})});
      var d={};try{d=await r.json()}catch(_){}
      if(r.ok){show('Password berhasil diganti. Mengalihkan...','info');setTimeout(function(){location.replace(d.next||'/')},700);return}
      if(r.status===401){location.replace('/login?expired=1');return}
      show(typeof d.detail==='string'?d.detail:'Gagal mengganti password.','err');
    }catch(err){show('Tidak dapat menghubungi server. Periksa koneksi Anda.','err')}
    b.disabled=false;b.textContent='SIMPAN PASSWORD BARU';
  });
})();
</script>
</body>
</html>
