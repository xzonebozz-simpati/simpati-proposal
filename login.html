<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Login | PROPOSAL MANAGEMENT SIMPATI 555</title>
<style>
:root{--maroon:#5b1018;--deep:#31090e;--gold:#d8b15a;--cream:#f7f1e8;--ink:#292321;--muted:#756c68;--line:#e7ddd2}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;padding:20px;color:var(--ink);
  font:15px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
  background:radial-gradient(circle at 20% 10%,#7d1626 0,#31090e 55%,#1d0508 100%)}
.card{width:100%;max-width:420px;background:var(--cream);border:2px solid var(--gold);border-radius:16px;
  padding:28px 26px;box-shadow:0 18px 50px #0008}
.brand{font-size:12px;letter-spacing:.14em;color:var(--maroon);font-weight:800}
h1{margin:6px 0 4px;font-size:22px;color:var(--deep)}
p.sub{margin:0 0 18px;color:var(--muted);font-size:13.5px}
label{display:block;font-weight:700;font-size:13px;margin:12px 0 5px;color:var(--deep)}
input{width:100%;padding:11px 12px;border:1px solid #cdbfae;border-radius:9px;font:inherit;background:#fff}
input:focus{outline:2px solid var(--gold);border-color:var(--maroon)}
button{width:100%;margin-top:18px;padding:12px;border:1px solid var(--gold);border-radius:10px;cursor:pointer;
  color:#fff;font:inherit;font-weight:800;background:linear-gradient(110deg,#8c1c2b,var(--maroon))}
button:disabled{opacity:.6;cursor:wait}
.msg{display:none;margin-top:14px;padding:10px 12px;border-radius:9px;font-size:13.5px;border:1px solid}
.msg.err{display:block;background:#fde9ea;border-color:#e3a3a8;color:#7a1220}
.msg.info{display:block;background:#fff6dc;border-color:#e0ad35;color:#5a3d0a}
.note{margin-top:16px;font-size:12.5px;color:var(--muted)}
</style>
</head>
<body>
<main class="card">
  <div class="brand">SIMPATI 555 · MODUL PROPOSAL MANAGEMENT</div>
  <h1>Masuk Admin DPS</h1>
  <p class="sub">Gunakan akun yang dibuat Superadmin di SIMPATI 555 sesuai wilayah kecamatan Anda.</p>
  <form id="f" autocomplete="on">
    <label for="u">Username</label>
    <input id="u" name="username" autocomplete="username" required maxlength="80" autofocus>
    <label for="p">Password</label>
    <input id="p" name="password" type="password" autocomplete="current-password" required maxlength="200">
    <button id="b" type="submit">MASUK</button>
  </form>
  <div id="m" class="msg" role="alert"></div>
  <p class="note">Lupa password atau belum punya akun? Hubungi Superadmin SIMPATI 555.</p>
</main>
<script>
(function(){
  var q=new URLSearchParams(location.search), m=document.getElementById('m');
  function show(text,kind){m.textContent=text;m.className='msg '+kind}
  if(q.get('expired'))show('Sesi Anda berakhir. Silakan login kembali.','info');
  if(q.get('error')==='upstream')show('SIMPATI 555 sedang tidak dapat dihubungi. Coba lagi sebentar.','err');
  document.getElementById('f').addEventListener('submit',async function(e){
    e.preventDefault();
    var b=document.getElementById('b');b.disabled=true;b.textContent='MEMERIKSA...';m.className='msg';
    try{
      var r=await fetch('/api/auth/login',{method:'POST',
        headers:{'Content-Type':'application/json','X-Requested-With':'proposal'},
        body:JSON.stringify({username:document.getElementById('u').value,password:document.getElementById('p').value})});
      var d={};try{d=await r.json()}catch(_){}
      if(r.ok){location.replace('/');return}
      var detail=d.detail;
      show(typeof detail==='string'?detail:'Login gagal. Periksa username dan password.','err');
      document.getElementById('p').value='';
    }catch(err){show('Tidak dapat menghubungi server. Periksa koneksi Anda.','err')}
    b.disabled=false;b.textContent='MASUK';
  });
})();
</script>
</body>
</html>
